name: Deploy

on:
  push:
    branches:
      - main

# Only one deployment may modify the server's Compose stack at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Rebuild and restart Docker stack
    runs-on: ubuntu-latest
    environment: production
    env:
      LFS_DEPLOY_TOKEN: ${{ github.token }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: LFS_DEPLOY_TOKEN
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout --force main
            git reset --hard origin/main
            git lfs install --local
            git config --local lfs.url "https://github.com/MujtabaGillani/Syed-logistics.git/info/lfs"
            if [ -z "${LFS_DEPLOY_TOKEN:-}" ]; then
              echo "LFS_DEPLOY_TOKEN is not configured."
              exit 1
            fi
            lfs_credentials_file="$(mktemp)"
            trap 'rm -f "$lfs_credentials_file"' EXIT
            printf 'https://x-access-token:%s@github.com\n' "$LFS_DEPLOY_TOKEN" > "$lfs_credentials_file"
            chmod 600 "$lfs_credentials_file"
            git -c credential.helper= -c "credential.helper=store --file=$lfs_credentials_file" lfs pull origin main
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up --build --detach
            docker compose -f docker-compose.production.yml ps
