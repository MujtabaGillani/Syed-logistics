name: Deploy

on:
  push:
    branches:
      - main

# Only one deployment may modify the server's Compose stack at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Rebuild and restart Docker stack
    runs-on: ubuntu-latest
    environment: production
    env:
      LFS_DEPLOY_TOKEN: ${{ secrets.LFS_DEPLOY_TOKEN }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: LFS_DEPLOY_TOKEN
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout --force main
            git reset --hard origin/main
            git lfs install --local
            if [ -z "${LFS_DEPLOY_TOKEN:-}" ]; then
              echo "LFS_DEPLOY_TOKEN is not configured."
              exit 1
            fi
            git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo password="$LFS_DEPLOY_TOKEN"; }; f' lfs pull origin main
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up --build --detach
            docker compose -f docker-compose.production.yml ps
